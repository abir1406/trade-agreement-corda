apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

sourceCompatibility = 17
targetCompatibility = 17

configurations {
    quasar
}

dependencies {
    quasar "co.paralleluniverse:quasar-core:0.9.0_r3@jar"

    implementation project(":contracts")
    implementation project(":workflows")

    implementation "net.corda:corda-rpc:$corda_release_version"
    implementation "net.corda:corda-core:$corda_release_version"
    implementation "net.corda:corda-node-driver:$corda_release_version"
    implementation "net.corda:corda-test-utils:$corda_release_version"
    implementation "net.corda:corda-core-test-utils:$corda_release_version"
    implementation "javax.persistence:javax.persistence-api:2.2"
    implementation "co.paralleluniverse:quasar-core:0.9.0_r3"

    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "junit:junit:$junit_version"
}

springBoot {
    mainClass = 'net.corda.tradeagreement.server.TradeAgreementServerApp'
}

bootRun {
    doFirst {
        jvmArgs = [
            "-javaagent:${configurations.quasar.singleFile}=x(org.gradle,worker.org.gradle,org.junit,com.intellij)",
            "--add-opens=java.base/java.lang=ALL-UNNAMED",
            "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
            "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
            "--add-opens=java.base/java.io=ALL-UNNAMED",
            "--add-opens=java.base/java.net=ALL-UNNAMED",
            "--add-opens=java.base/java.util=ALL-UNNAMED",
            "--add-opens=java.base/java.util.concurrent=ALL-UNNAMED",
            "--add-opens=java.base/java.time=ALL-UNNAMED",
            "--add-opens=java.base/java.math=ALL-UNNAMED",
            "--add-opens=java.base/java.nio=ALL-UNNAMED",
            "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
            "--add-opens=java.base/java.security=ALL-UNNAMED",
            "--add-opens=java.base/java.security.cert=ALL-UNNAMED",
            "--add-opens=java.base/sun.security.x509=ALL-UNNAMED",
            "--add-opens=java.base/sun.security.util=ALL-UNNAMED",
            "--add-opens=java.base/sun.security.pkcs=ALL-UNNAMED"
        ]
    }
}

